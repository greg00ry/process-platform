services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  wiremock:
    image: wiremock/wiremock:3.5.4
    ports:
      - "8089:8080"
    volumes:
      - ./operaton/src/main/resources/wiremock:/home/wiremock
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  htmx:
    build: ./htmx
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: "*"

  operaton:
    build: ./operaton
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/operaton
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CREDIT_SCORE_SERVICE_URL: http://wiremock:8080
      ECM_ADAPTER_URL: http://ecm-adapter:8090
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  ecm-adapter:
    build: ./ecm-adapter
    ports:
      - "8090:8090"
    environment:
      ECM_BASE_URL: http://operaton:8080
      ADAPTER_ADDR: ":8090"
      KAFKA_BROKERS: kafka:9092
      ECM_EVENTS_TOPIC: ecm.document.events
    depends_on:
      kafka:
        condition: service_healthy
      operaton:
        condition: service_started
